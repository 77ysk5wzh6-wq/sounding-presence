<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounding Presence — Audio Scenes</title>
<link rel="icon" href="data:,">
<!--
  hand_sweep presentation — 교수님 전달·배포용 인터페이스.
  내부 튜닝 파라미터는 보존하되 화면에는 시작·장면 전환 버튼만 노출한다.
  원본: hand_sweep.html
  ----------------------------------------------------------------
  · 흰 배경 + 손 추적만 (카메라 화면 없음)
  · 손바닥 중심(손목~중지밑동)의 이동 속도 → 마찰음 (손가락 개별 아님 = 쓸어내림)
  · 왼손/오른손 독립 오디오 + 스테레오 패닝 (왼손=왼쪽, 오른손=오른쪽)
  · 1€ 필터 + 데드존 스무딩 → 조금 움직이면 무음, 확실한 움직임에서 연속 변화
  · 연필 톤: 실제 종이 마찰 granular + 고정된 책상 modal 공명
  · 실행: 로컬 서버 필요 (카메라 권한).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #fafafa; font-family: -apple-system, system-ui, sans-serif; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; pointer-events: none; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; }
  #ui {
    position: fixed; z-index: 5; top: 14px; left: 14px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px; border-radius: 12px;
    background: rgba(255,255,255,.85); color: #18181b; font-size: 13px;
    box-shadow: 0 2px 14px rgba(0,0,0,.08); backdrop-filter: blur(6px);
  }
  #ui button { font: inherit; cursor: pointer; padding: 7px 13px; border-radius: 8px;
    border: 1px solid rgba(0,0,0,.15); background: #fff; }
  #ui button:hover { background: #f0f0f0; }
  #ui label { display: flex; align-items: center; gap: 5px; }
  #ui .val { opacity: .65; font-variant-numeric: tabular-nums; min-width: 30px; }
  #ui input[type=range] { width: 100px; }
  /* 파라미터 그룹: 음색별로 접히는 박스 */
  #ui .grp { flex: 0 0 100%; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap;
    padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(0,0,0,.08);
    background: rgba(0,0,0,.025); }
  #ui .grp[hidden] { display: none; }
  #ui .ghead { flex: 0 0 100%; font-size: 11px; letter-spacing: .04em; opacity: .5; margin-bottom: -2px; }
  #ui .grp label { font-size: 12px; }
  #status { position: fixed; z-index: 5; bottom: 12px; left: 14px; color: #71717a; font-size: 12px;
    font-variant-numeric: tabular-nums; }
  /* 눈 감으면 서서히 덮이는 블랙 오버레이 (opacity는 JS가 매 프레임 제어) */
  #blackout { position: fixed; inset: 0; z-index: 20; background: #000; opacity: 0; pointer-events: none; }

  /* 발표용 UI: 실행에 필요한 숨은 파라미터 DOM은 유지하고 조작 패널만 제거한다. */
  #ui {
    left: 50%; right: auto; transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 28px);
    justify-content: center; flex-wrap: wrap;
    padding: 9px; gap: 7px;
  }
  #ui > span,
  #ui .grp,
  #ui #reset { display: none !important; }
  #ui #start,
  #ui .timbreChoice {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 40px; white-space: nowrap;
  }
  #status { display: none !important; }
  @media (max-width: 620px) {
    #ui { top: 8px; max-width: calc(100vw - 16px); }
    #ui button { padding: 7px 10px; font-size: 12px; }
    #ui #start { flex-basis: 100%; }
  }
</style>

<video id="cam" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="blackout"></div>

<div id="ui">
  <button id="start">🔊 시작 (카메라 + 소리)</button>
  <span style="font-size:12px;opacity:.7">음색</span>
  <button class="timbreChoice" data-timbre="water-drops">🌊 물</button>
  <button class="timbreChoice" data-timbre="bark-friction">✏️ 연필</button>
  <button class="timbreChoice" data-timbre="harp-strings">🪉 하프</button>
  <button class="timbreChoice" data-timbre="wind-flow">🌬️ 바람</button>
  <button id="reset" title="이 음색의 슬라이더를 기본값으로">↺ 기본값</button>
  <span style="font-size:12px;opacity:.7">🎧 이어폰 권장</span>

  <!-- ── 공통 ── -->
  <div class="grp">
    <div class="ghead">공통</div>
    <label>음높이 <input id="pitch" type="range" min="0" max="1" step="0.01" value="0.45"><span class="val" id="pitchVal">0.45</span></label>
    <label>볼륨 <input id="vol" type="range" min="0" max="1" step="0.01" value="1.0"><span class="val" id="volVal">1.00</span></label>
    <label>민감도 <input id="sens" type="range" min="0.2" max="2" step="0.05" value="1"><span class="val" id="sensVal">1.00</span></label>
    <label title="MediaPipe가 제공하는 손별 score. 이 값보다 낮으면 해당 프레임의 위치·속도·소리를 무시">손 신뢰도 <input id="handConf" type="range" min="0.6" max="0.95" step="0.01" value="0.70"><span class="val" id="handConfVal">0.70</span></label>
    <label>손가락반영 <input id="finger" type="range" min="0" max="1" step="0.05" value="0.45"><span class="val" id="fingerVal">0.45</span></label>
  </div>

  <!-- ── 공간(head shadow) ── -->
  <div class="grp">
    <div class="ghead">🎧 공간 — 머리 차폐 모델 (구형 머리 r=9.19cm)</div>
    <label title="0=기존 HRTF만(A/B 비교용), 1=head shadow 위주">모델 반영 <input id="hsMix" type="range" min="0" max="1" step="0.01" value="0.6"><span class="val" id="hsMixVal">0.60</span></label>
    <label title="귀별 1/r 거리감쇠에 의한 좌우 레벨차. 가까울수록 자동으로 커짐">좌우 레벨차 <input id="hsIld" type="range" min="0" max="1" step="0.01" value="0.8"><span class="val" id="hsIldVal">0.80</span></label>
    <label title="머리 반대편 귀의 고역 차폐량(머리가 저역통과 필터로 작용)">머리 차폐 <input id="hsShadow" type="range" min="0" max="1" step="0.01" value="0.7"><span class="val" id="hsShadowVal">0.70</span></label>
    <label title="★거리감의 핵심. 멀수록 잔향 비중↑(DRR). 볼륨을 안 줄여도 거리가 느껴짐">거리 잔향(DRR) <input id="revAmt" type="range" min="0" max="1.5" step="0.01" value="0.42"><span class="val" id="revAmtVal">0.42</span></label>
    <label title="거리에 따른 볼륨 차이. 0=일정(잔향으로만 거리 표현), 1=물리적 1/r(약 15dB)">거리 볼륨차 <input id="distAmt" type="range" min="0" max="1" step="0.01" value="0.73"><span class="val" id="distAmtVal">0.73</span></label>
    <label title="Woodworth 모델 귀별 도달 시간차. 1=물리값(최대 689μs). 저역 방향감의 핵심">ITD 시간차 <input id="itdAmt" type="range" min="0" max="1.5" step="0.01" value="0.86"><span class="val" id="itdAmtVal">0.86</span></label>
    <label title="근접 시 저역을 좌우로 분리(미세 시간차). 저음이 머릿속 중앙에 뭉치는 것 방지">근접 저역 분리 <input id="lowWide" type="range" min="0" max="1" step="0.01" value="0.6"><span class="val" id="lowWideVal">0.60</span></label>
    <label title="다가옴/멀어짐 → 음높이 미세 변화. 1=물리값(1m/s에서 5cents, 거의 안 들림). 2~4로 올려야 체감됨">도플러 <input id="doppler" type="range" min="0" max="6" step="0.05" value="2.5"><span class="val" id="dopplerVal">2.50</span></label>
    <label title="손바닥이 얼굴을 향할수록 직접음·고역이 열리고, 옆으로 돌면 반사 비중이 커짐">손바닥 지향성 <input id="palmDir" type="range" min="0" max="1" step="0.01" value="0.7"><span class="val" id="palmDirVal">0.70</span></label>
    <label title="0=브라우저 HRTF+구형 머리, 1=CIPIC 측정 HRIR. 27방향 필터를 90ms 크로스페이드">측정 HRTF <input id="hrtfMix" type="range" min="0" max="1" step="0.01" value="0.06"><span class="val" id="hrtfMixVal">0.06</span></label>
  </div>

  <!-- ── 확장 공간 엔진 ── -->
  <div class="grp">
    <div class="ghead">🏛 확장 엔진 — 룸/거리모델/반사/차폐 (§1·§3~§7·§9·§12·§14)</div>
    <label title="확장 엔진 전체 on/off. 끄면 기존(A+B+C) 동작만 남아 A/B 비교 가능"><input id="engineOn" type="checkbox" checked style="width:auto"> 엔진 ON</label>
    <label title="거리 감쇠 곡선 종류(§12)">거리모델
      <select id="distModel" style="font:inherit;padding:2px 4px;border-radius:6px">
        <option value="inverse" selected>inverse</option>
        <option value="linear">linear</option>
        <option value="exponential">exponential</option>
      </select></label>
    <label title="거리 감쇠 강도. 클수록 멀어질 때 급격히 작아짐">rolloff <input id="rolloff" type="range" min="0" max="3" step="0.05" value="0.55"><span class="val" id="rolloffVal">0.55</span></label>
    <label title="ISO 9613-1 공기흡수. 손 거리에선 물리적으로 0.1dB 미만이라 과장 배율 필요(1=거의 무음)">공기흡수 <input id="airExagg" type="range" min="0" max="3" step="0.05" value="1.2"><span class="val" id="airExaggVal">1.20</span></label>
    <label title="6면을 계산해 청감상 중요한 상위 3개 반사만 렌더링. 벽마다 지연·게인·흡음이 실시간 반영됨">초기반사 <input id="reflAmt" type="range" min="0" max="2" step="0.02" value="0.7"><span class="val" id="reflAmtVal">0.70</span></label>
    <label title="장애물 차폐(§7). 고역↓ 직접음↓ 반사↑">차폐 <input id="occlusion" type="range" min="0" max="1" step="0.01" value="0"><span class="val" id="occlusionVal">0.00</span></label>
    <label title="소스 위치 보간(§9). 클수록 부드럽지만 반응 느려짐">위치 스무딩 <input id="smooth" type="range" min="0" max="1" step="0.01" value="0.25"><span class="val" id="smoothVal">0.25</span></label>
    <label title="가상 방 크기(폭×높이×깊이 비율 유지). Sabine RT60 자동 계산">방 크기 <input id="roomScale" type="range" min="0.4" max="3" step="0.05" value="0.7"><span class="val" id="roomScaleVal">0.70</span></label>
    <label title="벽 재질 → 흡음계수 → RT60(Sabine)">벽 재질
      <select id="wallMat" style="font:inherit;padding:2px 4px;border-radius:6px">
        <option value="concrete">콘크리트 .02</option>
        <option value="plaster">석고 .03</option>
        <option value="glass" selected>유리 .05</option>
        <option value="wood">나무 .10</option>
        <option value="carpet">카펫 .40</option>
        <option value="curtain">커튼 .50</option>
        <option value="acoustic">흡음재 .80</option>
      </select></label>
  </div>

  <!-- ── 물 전용 ── -->
  <div class="grp" id="grpWater">
    <div class="ghead">🌊 물</div>
    <label>배경 밝기 <input id="bedTone" type="range" min="0" max="1" step="0.01" value="0.7"><span class="val" id="bedToneVal">0.70</span></label>
    <label>배경 볼륨 <input id="bedVol" type="range" min="0" max="1" step="0.01" value="1.0"><span class="val" id="bedVolVal">1.00</span></label>
    <label>방울 밀도 <input id="density" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val" id="densityVal">0.50</span></label>
    <label>방울 볼륨 <input id="bubbleVol" type="range" min="0" max="1" step="0.01" value="0.7"><span class="val" id="bubbleVolVal">0.70</span></label>
    <label>물살 휩쓸림 <input id="swirl" type="range" min="0" max="1" step="0.01" value="0.6"><span class="val" id="swirlVal">0.60</span></label>
  </div>

  <!-- ── 바람 전용 ── -->
  <div class="grp" id="grpWind" hidden>
    <div class="ghead">🌬️ 바람 — 공간 전체의 바람 + 손에서 생기는 국소 충돌음</div>
    <label title="손이 없어도 공간 전체에 낮게 유지되는 바람">배경 바람 <input id="windBed" type="range" min="0" max="0.8" step="0.01" value="0.31"><span class="val" id="windBedVal">0.31</span></label>
    <label title="정지한 손을 포함해 손 위치에서 들리는 바람의 기본 세기">손 충돌 <input id="windContact" type="range" min="0" max="3" step="0.01" value="3.00"><span class="val" id="windContactVal">3.00</span></label>
    <label title="손바닥 정면의 묵직한 압력음과 손날의 얇은 고역 난류 사이의 대비">각도 반영 <input id="windAngle" type="range" min="0" max="1" step="0.01" value="0.74"><span class="val" id="windAngleVal">0.74</span></label>
    <label title="손 이동·방향 전환·손가락 틈에서 생기는 거친 난류">난류 반응 <input id="windTurb" type="range" min="0" max="1.5" step="0.01" value="1.50"><span class="val" id="windTurbVal">1.50</span></label>
  </div>

  <!-- ── 연필 드로잉 전용 ── -->
  <div class="grp" id="grpBark" hidden>
    <div class="ghead">✏️ 연필 — 실제 종이 마찰 입자 + 앞쪽에 고정된 책상 공명</div>
    <label title="선택적으로 유지되는 숲의 새·귀뚜라미 환경음">숲 배경 <input id="forestBed" type="range" min="0" max="1" step="0.01" value="0.28"><span class="val" id="forestBedVal">0.28</span></label>
    <label title="원본 녹음의 서로 다른 구간을 독립적인 마찰 질감 후보로 비교">마찰 샘플
      <select id="pencilRegion" style="font:inherit;padding:2px 4px;border-radius:6px">
        <option value="-1">전체 혼합</option>
        <option value="0">A — 밝고 고운 결 (6.75–7.60s)</option>
        <option value="1">B — 둥글고 촘촘함 (9.15–10.05s)</option>
        <option value="2">C — 가볍고 부드러움 (14.25–15.15s)</option>
        <option value="3" selected>D — 짧고 날카로움 (18.2–20.7s)</option>
        <option value="4">E — 거칠고 어두움 (22.15–22.95s)</option>
      </select>
    </label>
    <label title="입자 길이와 샘플 위치 변화량">종이 질감 <input id="rough" type="range" min="0" max="1" step="0.01" value="0.48"><span class="val" id="roughVal">0.48</span></label>
    <label title="책상으로 전달되는 낮은 공명 에너지">책상 몸통 <input id="body" type="range" min="0" max="1" step="0.01" value="0.98"><span class="val" id="bodyVal">0.98</span></label>
    <label title="연필심과 종이 마찰의 고역량">연필 밝기 <input id="bright" type="range" min="0" max="1" step="0.01" value="1.00"><span class="val" id="brightVal">1.00</span></label>
    <label title="고정된 책상 공명으로 보내는 양">책상 울림 <input id="reso" type="range" min="0" max="1" step="0.01" value="0.98"><span class="val" id="resoVal">0.98</span></label>
    <label title="손 속도에 따라 겹치는 마찰 입자의 밀도">입자 밀도 <input id="slipRate" type="range" min="0" max="1" step="0.01" value="1.00"><span class="val" id="slipRateVal">1.00</span></label>
    <label title="샘플 위치·길이·재생속도의 무작위 변화량">질감 변주 <input id="slipJit" type="range" min="0" max="1" step="0.01" value="0.16"><span class="val" id="slipJitVal">0.16</span></label>
    <label title="연필이 종이에 닿는 가상 압력과 마찰 세기">필압 <input id="slipDepth" type="range" min="0" max="1" step="0.01" value="0.10"><span class="val" id="slipDepthVal">0.10</span></label>
  </div>

  <!-- ── 하프 전용 ── -->
  <div class="grp" id="grpHarp" hidden>
    <div class="ghead">🪉 하프 — 좌우로 현을 가로지를 때만 플럭됩니다 (수직 이동은 무음)</div>
    <label title="낮으면 작은 좌우 움직임에도 현을 튕김">플럭 민감도 <input id="harpSens" type="range" min="0.5" max="2" step="0.05" value="1.00"><span class="val" id="harpSensVal">1.00</span></label>
    <label title="현의 자연 감쇠 길이">울림 <input id="harpSustain" type="range" min="0" max="1" step="0.01" value="0.72"><span class="val" id="harpSustainVal">0.72</span></label>
  </div>
</div>
<div id="status">대기 중…</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="./cipic_hrir_data.js"></script>

<script>
const video = document.getElementById('cam');
const canvas = document.getElementById('overlay');
const gtx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const roughEl = document.getElementById('rough'), pitchEl = document.getElementById('pitch');
const volEl = document.getElementById('vol'), sensEl = document.getElementById('sens');
// 슬라이더 목록(공통 / 물 / 연필 / 하프 / 바람). 여기 등록하면 값표시·기본값복원이 자동으로 붙는다.
const SLIDERS = {
  common: ['pitch','vol','sens','handConf','finger','hsMix','hsIld','hsShadow','revAmt','distAmt',
           'itdAmt','lowWide','doppler','palmDir','hrtfMix',

// ============================================================
// 1€ Filter — 손 속도 평활화
// ============================================================
class OneEuro {
  // minCut 높을수록 반응 빠름(지연↓), beta 높을수록 빠른 움직임에 더 즉각적
  constructor(minCut=3.5, beta=0.05){ this.minCut=minCut; this.beta=beta; this.x=null; this.dx=0; this.t=null; }
  _a(c,dt){ const tau=1/(2*Math.PI*c); return 1/(1+tau/dt); }
  filter(x,t){
    if(this.t==null){ this.t=t; this.x=x; return x; }
    let dt=(t-this.t)/1000; if(dt<=0) dt=1/120;
    const dx=(x-this.x)/dt, aD=this._a(1.0,dt);
    this.dx=aD*dx+(1-aD)*this.dx;
    const cut=this.minCut+this.beta*Math.abs(this.dx), a=this._a(cut,dt);
    this.x=a*x+(1-a)*this.x; this.t=t; return this.x;
  }
}

// ============================================================
// 나무껍질 마찰 워클릿 (drag_friction 엔진 변형)
//   여기(문지름 노이즈) + 모달 공명 색칠. 나무껍질용으로 톤 조정.
//   파라미터: speed(0~1 속도), rough, pitch, pan(패닝은 노드에서)
// ============================================================
const WORKLET = `
class BarkFriction extends AudioWorkletProcessor {
  static get parameterDescriptors(){ return [
    {name:'drive', defaultValue:0, minValue:0, maxValue:1, automationRate:'k-rate'},  // 속도(여기 세기)
    {name:'rough', defaultValue:0.7, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'pitch', defaultValue:0.30, minValue:0, maxValue:1, automationRate:'k-rate'},
    // --- 튜닝용 추가 파라미터 ---
    {name:'slipRate',  defaultValue:0.45, minValue:0, maxValue:1, automationRate:'k-rate'}, // 걸림 빈도(평균)
    {name:'slipJit',   defaultValue:0.85, minValue:0, maxValue:1, automationRate:'k-rate'}, // 걸림 불규칙도 ★드르륵 제거
    {name:'slipDepth', defaultValue:0.55, minValue:0, maxValue:1, automationRate:'k-rate'}, // 걸림 세기
    {name:'body',      defaultValue:0.55, minValue:0, maxValue:1, automationRate:'k-rate'}, // 저역 몸통(울림)
    {name:'bright',    defaultValue:0.35, minValue:0, maxValue:1, automationRate:'k-rate'}, // 밝기(여기 노이즈 고역)
    {name:'reso',      defaultValue:0.36, minValue:0, maxValue:1, automationRate:'k-rate'}, // 공명 비중
  ]; }
  constructor(){
    super(); this.sr=sampleRate;
    // 나무껍질: 저역 몸통 위주. 비화음적 3모드(전체적으로 한 옥타브 낮춤).
    // 기존 320/720/1450 → 저음 요청 반영해 하향. body 파라미터로 저역 2모드를 더 키움.
    this.modes=[
      {f:150,q:8,z1:0,z2:0,g:0.62},
      {f:355,q:7,z1:0,z2:0,g:0.46},
      {f:790,q:5,z1:0,z2:0,g:0.22},
    ];
    this.lp=0; this.lp2=0; this.env=0;
    this.grit=0; this.gritT=0;
    // === stick-slip: 주기적 위상 램프(=드르륵 원인) 제거, 이벤트 기반으로 ===
    // 다음 걸림까지 남은 샘플 수. 매 이벤트마다 난수로 새로 뽑아 "박자"를 없앤다.
    this.slipCd=0;          // countdown (samples)
    this.slipAmp=0;         // 현재 걸림 그레인 진폭(감쇠)
    this.slipDec=0.999;     // 그레인 감쇠 계수
    this.dcz=0;             // DC 제거용
  }
  process(_,outs,p){
    const out=outs[0][0]; if(!out) return true;
    const drive=p.drive[0], rough=p.rough[0], pitch=p.pitch[0];
    const slipRate=p.slipRate[0], slipJit=p.slipJit[0], slipDepth=p.slipDepth[0];
    const body=p.body[0], bright=p.bright[0], reso=p.reso[0];
    const pmul=Math.pow(2, pitch-0.5);            // 0.7~1.4배
    // 공명 계수 — body가 클수록 저역 2모드 게인↑, 최고역 모드 게인↓ (어두운 몸통)
    for(let k=0;k<this.modes.length;k++){
      const m=this.modes[k];
      const f=Math.min(m.f*pmul, this.sr*0.45);
      const w=2*Math.PI*f/this.sr;
      m.r=Math.exp(-Math.PI*f/(m.q*this.sr));
      m.a1=2*m.r*Math.cos(w); m.a2=-m.r*m.r; m.norm=1-m.r;
      // k=0,1은 저역 / k=2는 고역. body로 무게중심 이동.
      m.gain = (k<2) ? m.g*(0.55+body*1.15) : m.g*(1.25-body*0.95);
    }
    // 여기 노이즈 대역: bright가 낮을수록 어두운(저역) 문지름 소리.
    const lpCut=Math.min(0.6, (0.012+bright*0.055+drive*(0.06+bright*0.30))*pmul);
    // 껍질의 불규칙한 걸림 세기
    const stick=(0.25+rough*0.45)*slipDepth*2;
    // 평균 걸림 간격(샘플). slipRate·drive가 높을수록 촘촘.
    const meanHz = (6+slipRate*60) * (0.25+drive*1.6);
    const meanSamp = this.sr/Math.max(1, meanHz);
    for(let i=0;i<out.length;i++){
      // 여기 = 지속 필터드 노이즈
      const white=Math.random()*2-1;
      this.lp+=lpCut*(white-this.lp); this.lp2+=lpCut*(this.lp-this.lp2);
      let exc=this.lp2*1.6;
      // === stick-slip: 이벤트 기반 + 간격 난수화 ===
      // slipJit=0 → 균일 간격(옛 드르륵), 1 → 지수분포에 가까운 완전 불규칙.
      // 규칙적 패턴이 안 생기도록 간격 자체를 매번 새로 뽑는다.
      this.slipCd -= 1;
      if(this.slipCd<=0){
        // 균일(1) ↔ 지수분포(-ln U) 를 slipJit으로 보간. 지수분포 = 무기억성 = 박자 없음.
        const u=Math.max(1e-6, Math.random());
        const expo=-Math.log(u);                       // 평균 1, 분산 큼
        const shape=(1-slipJit)*1 + slipJit*expo;
        this.slipCd = Math.max(8, meanSamp*shape);
        // 그레인: 걸림 하나가 짧게 "탁" 하고 감쇠. 길이도 난수.
        const durMs = 3 + Math.random()*(6+rough*14);
        this.slipDec = Math.exp(-1/(durMs*0.001*this.sr));
        this.slipAmp = (0.45+Math.random()*0.55);
      }
      this.slipAmp *= this.slipDec;
      // 걸림 = 여기 진폭을 순간적으로 눌렀다 놓음(마찰의 stick 구간)
      exc *= 1 - stick*0.5*this.slipAmp;
      // 거친 그릿(껍질 조각) — rough에 강하게 연동
      if(this.gritT<=0){
        if(Math.random()<0.0012*(0.3+drive)*rough){ this.grit=(Math.random()*2-1)*0.5*rough; this.gritT=180; }
        else this.grit*=0.9;
      } else { this.gritT--; this.grit*=0.9; }
      exc+=this.grit*0.6;
      // 광대역 거칠기
      exc+=(Math.random()*2-1)*rough*rough*0.14*Math.abs(exc);
      // 공명 색칠
      let res=0;
      for(let k=0;k<this.modes.length;k++){
        const m=this.modes[k]; const x=exc*m.gain*m.norm;
        const y=x+m.a1*m.z1+m.a2*m.z2; m.z2=m.z1; m.z1=y; res+=y;
      }
      // reso: 공명(울림) vs 원 노이즈 비중.
      let s=exc*(0.85-reso*0.55)+res*(0.5+reso*2.0);
      // 활성 엔벨로프 — attack 매우 빠르게(즉각), release는 약간 부드럽게
      const target=drive;
      this.env+=(target-this.env)*(target>this.env?0.08:0.012);
      s*=this.env*0.42;
      // DC 제거(저역 강조 시 오프셋 누적 방지)
      this.dcz += 0.0008*(s-this.dcz); s -= this.dcz;
      out[i]=Math.tanh(s);
    }
    return true;
  }
}
registerProcessor('bark-friction-legacy', BarkFriction);

// ============================================================
// 실제 연필 녹음을 사용하는 거리 구동 granular 엔진.
// 출력 0은 손끝의 마찰음, 출력 1은 고정된 책상 공명용 excitation이다.
// ============================================================
class PencilFriction extends AudioWorkletProcessor {
  static get parameterDescriptors(){ return [
    {name:'drive', defaultValue:0, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'rough', defaultValue:0.62, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'pitch', defaultValue:0.30, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'slipRate', defaultValue:0.58, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'slipJit', defaultValue:0.78, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'slipDepth', defaultValue:0.58, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'body', defaultValue:0.42, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'bright', defaultValue:0.58, minValue:0, maxValue:1, automationRate:'k-rate'},
    {name:'reso', defaultValue:0.40, minValue:0, maxValue:1, automationRate:'k-rate'},
  ]; }
  constructor(){
    super();
    this.sr=sampleRate;
    this.sample=null;
    // 비교가 쉽도록 0.8~1초 안팎의 짧은 질감 조각을 사용한다.
    // D는 기존 후보를 유지하고 A/B/C/E만 새 구간으로 교체했다.
    this.regions=new Float32Array([
      6.75,7.60, 9.15,10.05, 14.25,15.15, 18.20,20.65, 22.15,22.95
    ]);
    this.N=20;
    this.grains=[];
    for(let i=0;i<this.N;i++) this.grains.push({on:false,pos:0,rate:1,age:0,len:1,amp:0});
    this.nextGrain=0;
    this.spawnPhase=0;
    this.regionChoice=-1;
    this.env=0;
    this.lp=0;
    this.dc=0;
    this.seed=0x6d2b79f5;
    this.window=new Float32Array(2048);
    for(let i=0;i<this.window.length;i++){
      const s=Math.sin(Math.PI*i/(this.window.length-1));
      this.window[i]=s*s;
    }
    this.port.onmessage=e=>{
      const d=e.data;
      if(d&&d.type==='sample'&&d.samples instanceof Float32Array) this.sample=d.samples;
      else if(d&&d.type==='region'){
        const index=d.index|0;
        this.regionChoice=index>=0&&index<5 ? index : -1;
      }
    };
  }
  _rand(){
    let x=this.seed|0;
    x^=x<<13; x^=x>>>17; x^=x<<5;
    this.seed=x|0;
    return (x>>>0)/4294967296;
  }
  _spawn(drive,rough,pitch,jitter){
    const data=this.sample;
    if(!data||data.length<4096) return;
    const g=this.grains[this.nextGrain];
    this.nextGrain=(this.nextGrain+1)%this.N;
    const region=this.regionChoice>=0 ? this.regionChoice : (this._rand()*5)|0;
    const startSec=this.regions[region*2];
    const endSec=this.regions[region*2+1];
    // 원본에 녹음된 글씨 획의 리듬이 남지 않도록 10~28ms 미세 입자만 사용한다.
    const duration=0.010+(1-drive)*0.012+this._rand()*0.006*(0.25+rough);
    const pitchMul=Math.pow(2,(pitch-0.5)*0.40);
    // 손 속도 0→1에서 최대 +36 semitones(3옥타브). 저속은 완만하고 고속에서
    // 크게 벌어지는 곡선으로 실제 샘플 읽기 속도를 최대 8배까지 올린다.
    // 속도를 올려 종이를 빠르게 긁을수록 마찰 스펙트럼 전체가 위로 이동한다.
    const speedPitch=Math.pow(2,Math.pow(drive,1.15)*3.00);
    const rate=pitchMul*speedPitch*(0.97+(this._rand()-0.5)*0.08*jitter);
    const len=Math.max(384,Math.min(1536,(duration*this.sr)|0));
    const lastStart=Math.max(startSec,endSec-len*rate/this.sr-0.005);
    const offset=startSec+this._rand()*Math.max(0.001,lastStart-startSec);
    g.on=true;
    g.pos=offset*this.sr;
    g.rate=rate;
    g.age=0;
    g.len=len;
    g.amp=0.72+this._rand()*0.38;
  }
  process(_,outs,p){
    const out=outs[0][0];
    const desk=outs[1]&&outs[1][0];
    if(!out) return true;
    const drive=p.drive[0], rough=p.rough[0], pitch=p.pitch[0];
    const density=p.slipRate[0], jitter=p.slipJit[0], pressure=p.slipDepth[0];
    const body=p.body[0], bright=p.bright[0], reso=p.reso[0];
    const data=this.sample;
    // 매우 짧은 Hann 입자들이 서로 2~3개씩 겹쳐 연속적인 종이 마찰이 되게 한다.
    const spawnRate=drive>0.008 ? 65+density*45+drive*(110+density*110) : 0;
    const attack=1-Math.exp(-1/(0.007*this.sr));
    const release=1-Math.exp(-1/(0.075*this.sr));
    // 느릴 때는 종이의 어두운 마찰만 남기고, 빠를수록 원본의 15kHz대 입자까지 연다.
    const toneDrive=Math.pow(drive,0.82);
    const cutoff=Math.min(16500,1800+bright*4200+toneDrive*(9000+bright*3500));
    const lpA=1-Math.exp(-2*Math.PI*cutoff/this.sr);
    // 저속을 크게 들리게 만들던 0.72 지수를 반대로 세운다.
    // drive=0.2는 최대속도 대비 약 8%, 0.5는 약 34%만 출력된다.
    const target=drive>0.008 ? Math.pow(drive,1.55)*(0.56+pressure*0.76) : 0;
    for(let i=0;i<out.length;i++){
      this.env+=(target-this.env)*(target>this.env?attack:release);
      this.spawnPhase+=spawnRate/this.sr;
      if(this.spawnPhase>=1){
        this.spawnPhase-=1;
        this._spawn(drive,rough,pitch,jitter);
      }
      let sum=0,active=0;
      if(data){
        for(let k=0;k<this.N;k++){
          const g=this.grains[k];
          if(!g.on) continue;
          const idx=g.pos|0;
          if(g.age>=g.len||idx<0||idx+1>=data.length){ g.on=false; continue; }
          const frac=g.pos-idx;
          const sample=data[idx]+(data[idx+1]-data[idx])*frac;
          const wi=Math.min(2047,(g.age*2047/g.len)|0);
          sum+=sample*this.window[wi]*g.amp;
          g.pos+=g.rate;
          g.age++;
          active++;
        }
      }
      if(active>1) sum/=Math.sqrt(active*0.72);
      this.lp+=lpA*(sum-this.lp);
      let direct=this.lp*this.env*(0.92+rough*0.16);
      this.dc+=0.0012*(direct-this.dc);
      direct-=this.dc;
      out[i]=Math.max(-1,Math.min(1,direct));
      if(desk) desk[i]=direct*reso*(0.12+body*0.34);
    }
    return true;
  }
}
registerProcessor('bark-friction', PencilFriction);

// ============================================================
// 물(기포) 워클릿 — Nemisindo 물 모델과 같은 원리
//   물소리 = 크기가 랜덤한 기포들이 각각 짧은 "삐융↗"(음 상승+지수감쇠 사인)
//   을 내는 것의 중첩. drive(손 속도) → 기포 발생 밀도(Stream Speed).
//   파라미터 기본값은 Nemisindo 스크린샷 반영.
// ============================================================
class WaterDrops extends AudioWorkletProcessor {
  static get parameterDescriptors(){ return [
    {name:'drive', defaultValue:0, minValue:0, maxValue:1, automationRate:'k-rate'},    // 손 속도 → 기포 밀도
    {name:'pitch', defaultValue:0.45, minValue:0, maxValue:1, automationRate:'k-rate'}, // 기포 음높이
    {name:'bedTone', defaultValue:0.30, minValue:0, maxValue:1, automationRate:'k-rate'},// 배경음 음높이(밝기)
    {name:'bedVol', defaultValue:0.6, minValue:0, maxValue:1, automationRate:'k-rate'},  // 배경음 볼륨
    {name:'density', defaultValue:0.5, minValue:0, maxValue:1, automationRate:'k-rate'}, // 물살 방울 밀도
    {name:'bubbleVol', defaultValue:0.7, minValue:0, maxValue:1, automationRate:'k-rate'},// 방울 볼륨
    {name:'swirl', defaultValue:0.6, minValue:0, maxValue:1, automationRate:'k-rate'},   // 물 휩쓸림(난류) 볼륨
  ]; }
  constructor(){
    super(); this.sr=sampleRate;
    // 동시에 울릴 수 있는 기포 보이스 풀
    this.N=24; this.v=[];
    for(let i=0;i<this.N;i++) this.v.push({on:false, ph:0, f:0, df:0, a:0, dec:0, atk:1, atkInc:1});
    this.spawnPhase=0;
    // Nemisindo 값 반영
    this.dropMin=1.32; this.dropMax=19.99; this.pitchRise=0.13; this.riseLimit=0.78;
    // 기포 로우패스 상태 (고음 노이즈 제거)
    this.blp1=0; this.blp2=0; this.blp3=0;
    this.hp=0;   // 저역 제거용 하이패스 상태
    // === 물 휩쓸림(난류) 층: 손 속도로 구동되는 연속 노이즈 "쏴~" ===
    this.swLP1=0; this.swLP2=0; this.swHP=0; this.swEnv=0;   // 난류 필터/엔벨로프 상태
    // === 배경 저음 물소리 (손과 완전 분리, 상시 흐름) ===
    // 브라운 노이즈(적분 노이즈)를 여러 단 저역통과 → "쏴~" 없는 저음 수중음.
    this.brown=0;
    this.bLP1=0; this.bLP2=0; this.bLP3=0;
    // 아주 느린 진폭 스웰들(위상 다름) = 규칙적 리듬 없이 뭉근히 출렁이는 흐름.
    this.sw1=Math.random(); this.sw2=Math.random(); this.sw3=Math.random();
    // 저음 공명(수중 "웅" 감) — 흐르는 노이즈를 통과시킬 밴드.
    this.rz1=0; this.rz2=0;
  }
  _spawn(amp){
    // 빈 보이스 찾기
    let s=null; for(const x of this.v){ if(!x.on){ s=x; break; } }
    if(!s){ // 다 차면 가장 오래된(진폭 작은) 것 재사용
      s=this.v.reduce((m,x)=> x.a<m.a?x:m, this.v[0]);
    }
    // === 과거의 "물방울 느낌" 복원 + 우웅 방지 ===
    // 우웅 원인은 (a)한 대역(160~320Hz) 몰림 (b)빽빽한 겹침 뿐이었음.
    // → 음색 파라미터(기준주파수/처프/지속)는 과거 그대로, 크기는 "균등분포"로 넓게 펴서
    //   특정 대역 몰림만 방지. (과거는 max(rand,rand)로 큰기포=저역에 몰려서 우웅)
    const bias = this._drive || 0;
    let r = Math.random();                       // 균등분포 → 주파수 골고루 분산
    r = r * (1 - bias*0.35);                      // 과거값
    if(this._deep) r = 0.85 + 0.15*Math.random();
    const dmax = this._deep ? 22 : 11;            // 과거 크기 범위 복원
    const size = this.dropMin + r*(dmax-this.dropMin);
    // presence session과 동일한 기포 음역. 과도하게 밝아지는 것을 막는다.
    const fmax = this._deep ? (this._deepBright || 850) : 1150;
    s.f = Math.min(fmax, (1400 / size) * this._pmul);
    s.ph=0; s.on=true;
    s.atk=0; s.atkInc = 1/(0.002*this.sr);        // 과거 2ms 페이드인
    s.a = amp*(0.4+Math.random()*0.4);
    const durMs = 10 + (size/this.dropMax)*45;    // 과거 지속(10~55ms)
    s.dec = Math.exp(-1/(durMs*0.001*this.sr));
    // 과거 처프값 복원(뽀글~ 특유의 부드러운 상승).
    s.rise = 1 + this.pitchRise*this.riseLimit*0.6;
    s.df = Math.pow(s.rise, 1/(durMs*0.001*this.sr));
  }
  process(_,outs,p){
    const out=outs[0][0]; if(!out) return true;
    const drive=p.drive[0], pitch=p.pitch[0];
    const bedTone=p.bedTone[0], bedVol=p.bedVol[0], density=p.density[0], bubbleVol=p.bubbleVol[0];
    const swirl=(p.swirl?p.swirl[0]:0.6);
    this._pmul=Math.pow(2, pitch-0.5);
    this._drive=drive;                  // _spawn에서 손 속도로 기포 크기 편향
    // 손짓 기포 밀도: 과거 260은 빽빽해서 겹침=우웅. 100으로 성기게 → 우웅 방지하며 과거 음색.
    const rate = (drive*100) * (0.4 + density*1.6);
    const inc = rate/this.sr;
    for(let i=0;i<out.length;i++){
      // --- 손짓 기포 ---
      this.spawnPhase += inc;
      while(this.spawnPhase>=1){
        this.spawnPhase-=1;
        const amp = (0.1 + 0.9*drive) * (0.6 + 0.4*Math.random()) * bubbleVol * 1.9;
        this._spawn(amp);
      }
      // --- 기포 보이스 합산 (손짓 소리만) ---
      let bub=0;
      for(const b of this.v){
        if(!b.on) continue;
        b.ph += b.f/this.sr; if(b.ph>=1) b.ph-=1;
        if(b.atk<1){ b.atk += b.atkInc; if(b.atk>1) b.atk=1; }
        bub += Math.sin(2*Math.PI*b.ph)*b.a*b.atk;
        b.a *= b.dec; b.f *= b.df;
        if(b.a<0.0008) b.on=false;
      }
      // 과거처럼 원음 위주(선명). 최고역만 살짝 완화.
      this.blp1 += 0.5*(bub - this.blp1);
      let s = bub*0.8 + this.blp1*0.2;              // 과거 믹스 복원
      // 우웅 재발 보험: 아주 낮은 저역(~90Hz)만 살짝 감산. 음색엔 거의 영향 없음.
      this.hp += 0.012*(s - this.hp);
      s = s - this.hp*0.5;

      // === 물 휩쓸림(난류) 층: 손 속도로 구동되는 "저음" 연속 노이즈 (물이 뭉근히 밀림) ===
      // 나무 쓸림처럼 밝으면 안 됨 → 컷오프를 아주 낮게(저역 물덩어리 이동감).
      this.swEnv += 0.002*(drive - this.swEnv);
      const white2 = Math.random()*2-1;
      // 저역통과 3단, 컷오프 아주 낮게(속도로 살짝만 상승) → 깊은 "우르르/쏴" 저음.
      const cut = 0.006 + this.swEnv*0.02;         // ~45~200Hz (저음 물살)
      this.swLP1 += cut*(white2 - this.swLP1);
      this.swLP2 += cut*(this.swLP1 - this.swLP2);
      this.swHP  += cut*(this.swLP2 - this.swHP);
      const turbo = this.swHP;                     // 3단 저역통과 = 아주 어두운 저음 노이즈
      // 난류 볼륨: 속도²에 비례. 고속에서 저역이 과도해 "쿠구구구"로 뭉치지 않게 상한을 낮춘다.
      s += turbo * this.swEnv * this.swEnv * swirl * 3.8;

      out[i]=Math.tanh(s*0.75);
    }
    return true;
  }
}
registerProcessor('water-drops', WaterDrops);

// ============================================================
// 하프 워클릿 — 다성 Karplus-Strong 현 + 공명 모드.
// 실제 멀티샘플을 넣기 전에도 현의 어택·감쇠·공명을 유지하는 경량 물리 모델이다.
// 이벤트는 port 메시지로만 발생하므로, 수직 손 움직임은 이 프로세서에 도달하지 않는다.
// ============================================================
class HarpStrings extends AudioWorkletProcessor {
  constructor(){
    super(); this.sr=sampleRate; this.voices=[];
    for(let i=0;i<18;i++) this.voices.push({on:false, a:0, delay:0, buf:null});
    this.port.onmessage=(e)=>{ if(e.data?.type==='pluck') this.pluck(e.data); };
  }
  pluck(m){
    const f=440*Math.pow(2, ((m.note||60)-69)/12);
    // 너무 짧은 지연선은 고음에서 거칠어지므로 28 samples 이상으로 유지한다.
    const n=Math.max(28, Math.round(this.sr/f));
    let v=this.voices.find(x=>!x.on);
    if(!v) v=this.voices.reduce((quiet,x)=>x.a<quiet.a?x:quiet, this.voices[0]);
    const bright=Math.max(0,Math.min(1,m.bright??0.68));
    const vel=Math.max(0.08,Math.min(1,m.velocity??0.6));
    const buf=new Float32Array(n);
    // 손끝이 현을 미는 짧은 유색 잡음: 밝을수록 고역이 남는다.
    let color=0;
    for(let i=0;i<n;i++){
      const white=Math.random()*2-1;
      color += (0.12+bright*0.70)*(white-color);
      buf[i]=(color*(0.35+bright*0.65) + white*(0.14+bright*0.28))*vel;
    }
    v.on=true; v.a=vel; v.buf=buf; v.i=0; v.last=0;
    v.loss=0.9928 + (m.sustain??0.72)*0.0062 - Math.min(0.0018, f/15000000);
    v.bright=bright; v.f=f; v.delay=Math.max(0,Math.round((m.delay||0)*this.sr));
    v.modalPh=0; v.modalAmp=vel*(0.08+bright*0.16);
    v.modalDec=Math.exp(-1/(this.sr*(0.28+(m.sustain??0.72)*1.6)));
  }
  process(ins, outs){
    const out=outs[0][0]; if(!out) return true;
    // 실제 WAV 샘플은 메인 스레드에서 이 노드의 입력으로 보낸다.
    // 물리모델은 샘플 로딩 실패 시의 폴백으로만 같은 출력에 더해진다.
    const inBus=ins[0], inL=inBus?.[0], inR=inBus?.[1];
    for(let s=0;s<out.length;s++){
      let sample=(inL?inL[s]:0)+(inR?inR[s]:0);
      if(inL&&inR) sample*=0.5; // 스테레오 녹음은 기존 모노 공간화 체인으로 보내기 전 다운믹스
      let sum=0;
      for(const v of this.voices){
        if(!v.on) continue;
        if(v.delay>0){ v.delay--; continue; }
        const i=v.i, j=(i+1)%v.buf.length;
        const x=v.buf[i], next=v.buf[j];
        // 평균화된 피드백이 하프 현의 긴 자연 감쇠를 만든다.
        v.buf[i]=(0.5*(x+next) + (Math.random()*2-1)*0.0008*v.bright)*v.loss;
        v.i=j;
        v.modalPh += 2*Math.PI*v.f*(2.01+v.bright*0.015)/this.sr;
        if(v.modalPh>Math.PI*2) v.modalPh-=Math.PI*2;
        const body=Math.sin(v.modalPh)*v.modalAmp;
        v.modalAmp*=v.modalDec;
        v.a*=0.999992;
        sum += (x*0.92+body)*v.a;
        if(v.a<0.0012){ v.on=false; v.buf=null; }
      }
      // 실제 녹음 샘플에 물리모델용 tanh를 걸면 어택이 뭉개지고 왜곡된다.
      // 폴백 물리현만 부드럽게 제한하고, WAV는 원음 그대로 공간 체인으로 보낸다.
      out[s]=Math.max(-1, Math.min(1, sample+Math.tanh(sum*0.72)));
    }
    return true;
  }
}
registerProcessor('harp-strings', HarpStrings);

// ============================================================
// 바람 충돌 워클릿 — 하나의 실제 바람 녹음을 3대역으로 분리한다.
// 손의 면적·상대풍속·손가락 틈은 새 소리를 만들지 않고 대역 비율만 바꾼다.
// ============================================================
class WindFlow extends AudioWorkletProcessor {
  static get parameterDescriptors(){
    return [
      {name:'contact', defaultValue:0, minValue:0, maxValue:7, automationRate:'k-rate'},
      {name:'body', defaultValue:0.5, minValue:0, maxValue:1, automationRate:'k-rate'},
      {name:'turbulence', defaultValue:0.4, minValue:0, maxValue:2, automationRate:'k-rate'},
      {name:'hiss', defaultValue:0.3, minValue:0, maxValue:2.5, automationRate:'k-rate'},
    ];
  }
  constructor(){
    super();
    this.dc=0; this.bodyLP=0; this.midLP=0;
    this.aDC=1-Math.exp(-2*Math.PI*38/sampleRate);
    this.aBody=1-Math.exp(-2*Math.PI*680/sampleRate);
    this.aMid=1-Math.exp(-2*Math.PI*3400/sampleRate);
  }
  process(inputs, outputs, parameters){
    const input=inputs[0], out=outputs[0][0];
    if(!out) return true;
    const L=input?.[0], R=input?.[1];
    const contact=parameters.contact[0]||0;
    const body=parameters.body[0]||0;
    const turbulence=parameters.turbulence[0]||0;
    const hiss=parameters.hiss[0]||0;
    for(let i=0;i<out.length;i++){
      let x=(L?L[i]:0)+(R?R[i]:0);
      // 스테레오 평균(-6dB)이 아니라 등전력 모노 합산(-3dB)을 사용해
      // 국소 바람의 밀도를 보존한다. 전역 배경 루프의 크기에는 영향이 없다.
      if(L&&R) x*=0.70710678;
      this.dc += this.aDC*(x-this.dc);
      x-=this.dc;
      this.bodyLP += this.aBody*(x-this.bodyLP);
      this.midLP += this.aMid*(x-this.midLP);
      const low=this.bodyLP;
      const mid=this.midLP-this.bodyLP;
      const high=x-this.midLP;
      // 손바닥 정면에서는 원본의 대역 균형을 거의 그대로 통과시킨다.

// Etherealwinds Harp II CE: 음높이마다 하나의 고정 WAV(v3/RR1)만 사용한다.
// 손 속도는 추가 샘플 선택이 아니라 ADSR·EQ·미세 피치·압축을 함께 구동하는 excitation이다.
const HARP_SAMPLE_DIR='../sound_assets/harp/';
const HARP_SAMPLE_MIN=42, HARP_SAMPLE_MAX=79;
const HARP_PITCH_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const HARP_FIXED_SAMPLE_NOTES=Array.from({length:HARP_SAMPLE_MAX-HARP_SAMPLE_MIN+1},(_,i)=>HARP_SAMPLE_MIN+i);
const harpSampleBuffers=new Map(), harpSampleRequests=new Map();
function harpSampleSpec(note){
  // G5보다 높은 화면 음은 가장 가까운 G5 녹음을 피치 업한다.
  const root=Math.max(HARP_SAMPLE_MIN,Math.min(HARP_SAMPLE_MAX,note));
  const pitch=HARP_PITCH_NAMES[root%12], octave=Math.floor(root/12)-1;
  // 손가락 속도는 이 함수에서 음색을 바꾸지 않고, 아래 gain에서 볼륨에만 반영된다.
  const layer='v3', rr=1;
  const file=`EWHarp_Normal_${pitch}${octave}_${layer}_RR${rr}.wav`;
  return {file,note:root,key:file};
}
function requestHarpSample(spec){
  if(harpSampleBuffers.has(spec.key)) return Promise.resolve(harpSampleBuffers.get(spec.key));
  if(harpSampleRequests.has(spec.key)) return harpSampleRequests.get(spec.key);
  const request=fetch(HARP_SAMPLE_DIR+encodeURIComponent(spec.file))
    .then(res=>{ if(!res.ok) throw new Error(`${spec.file}: HTTP ${res.status}`); return res.arrayBuffer(); })
    .then(data=>ctx.decodeAudioData(data))
    .then(buffer=>{ harpSampleBuffers.set(spec.key,buffer); return buffer; })
    .catch(err=>{ console.warn('[harp] sample load failed:',err); return null; })
    .finally(()=>harpSampleRequests.delete(spec.key));
  harpSampleRequests.set(spec.key,request);
  return request;
}
function preloadHarpSamples(){
  return Promise.all(HARP_FIXED_SAMPLE_NOTES.map(note=>requestHarpSample(harpSampleSpec(note))))
    .then(()=>console.info(`[harp] ${harpSampleBuffers.size} fixed v3 samples ready`));
}
const harpFixedVoices=[];
const HARP_MAX_ACTIVE_VOICES=12;
function playHarpSample(which, note, excitation, delay, pose){
  if(!ctx) return false;
  const spec=harpSampleSpec(note), buffer=harpSampleBuffers.get(spec.key);
  // 첫 재생 전에도 물리현을 섞지 않는다. WAV 준비가 끝난 직후 같은 플럭을 재생한다.
  if(!buffer){
    requestHarpSample(spec).then(loaded=>{ if(loaded) playHarpSample(which,note,excitation,0,pose); });
    return true;
  }
  const sample={...spec,buffer};
  const when=ctx.currentTime+Math.max(0,delay||0);
  const e=Math.max(0,Math.min(1,excitation));
  const loudnessGain=Math.pow(e,1.4);                 // 지각상 자연스러운 강도 곡선
  const attack=0.018-(0.016*e);                       // weak 18ms → strong 2ms
  const decay=0.090-(0.050*e);
  const sustain=Math.max(0.001,loudnessGain*(0.94-0.16*e));
  const brightness=Math.pow(e,0.62);

  // 플럭 순간의 위치를 갖는 독립 HRTF 보이스. 손을 옮겨도 이 노드는 갱신하지 않는다.
  // sample → ADSR → excitation LPF → brightness → transient/noise → spectral tilt
  //        → compressor → 기존 거리/HRTF/room 경로
  const amp=ctx.createGain(), excitationLP=ctx.createBiquadFilter();
  const brightShelf=ctx.createBiquadFilter(), transientShelf=ctx.createBiquadFilter(), tiltShelf=ctx.createBiquadFilter();
  const hp=ctx.createBiquadFilter(), comp=ctx.createDynamicsCompressor();
  const spatialLP=ctx.createBiquadFilter(), panner=new PannerNode(ctx,{panningModel:'HRTF',distanceModel:'inverse',refDistance:0.25,maxDistance:3,rolloffFactor:0.9});
  hp.type='highpass'; hp.frequency.value=45; hp.Q.value=0.7;
  // 강할수록 넓은 대역/고역 셸프. v3 원본 하나를 약한 플럭에도 자연스럽게 만든다.
  excitationLP.type='lowpass'; excitationLP.Q.value=0.55;
  excitationLP.frequency.setValueAtTime(2500+15500*brightness,when); // 2.5kHz → 18kHz
  brightShelf.type='highshelf'; brightShelf.frequency.value=3000; brightShelf.Q.value=0.65;
  brightShelf.gain.setValueAtTime(6*e,when);                         // 0 → +6dB
  // 샘플의 첫 고역 성분만 들어 올려 손가락이 현을 놓는 미세한 노이즈를 만든다.
  transientShelf.type='highshelf'; transientShelf.frequency.value=8200; transientShelf.Q.value=0.7;
  transientShelf.gain.setValueAtTime(2+9*e,when);
  transientShelf.gain.linearRampToValueAtTime(0,when+(0.030-0.018*e));
  // 약한 플럭일수록 고주파가 더 빨리 사라지는 spectral tilt envelope.
  tiltShelf.type='highshelf'; tiltShelf.frequency.value=4100; tiltShelf.Q.value=0.55;
  tiltShelf.gain.setValueAtTime(0,when);
  tiltShelf.gain.linearRampToValueAtTime(-12+8*e,when+(0.070+0.210*e));
  // 강한 연주에서만 peak를 살짝 제어한다. 레이어 합성이나 하드 리미팅은 하지 않는다.
  comp.threshold.value=-7-10*e; comp.knee.value=12;
  comp.ratio.value=1.05+1.55*e; comp.attack.value=0.003+0.006*(1-e); comp.release.value=0.10+0.10*(1-e);
  const d=Math.max(0,Math.min(1,pose?.dist01??0.4)), near=1-d;
  spatialLP.type='lowpass'; spatialLP.frequency.value=2200+(16000-2200)*Math.pow(near,0.8); spatialLP.Q.value=0.7;
  const px=Math.max(-0.85,Math.min(0.85,(pose?.panPos??0)*(0.7+near*1.1)));
  if(panner.positionX){ panner.positionX.value=px; panner.positionY.value=-0.05; panner.positionZ.value=-0.2-d*1.1; }
  excitationLP.connect(brightShelf).connect(transientShelf).connect(tiltShelf).connect(hp).connect(comp);
  comp.connect(spatialLP).connect(panner).connect(master);
  const earlyDelay=ctx.createDelay(0.08), early=ctx.createGain(), late=ctx.createGain();
  earlyDelay.delayTime.value=0.014-0.010*d;
  early.gain.value=(0.03+0.80*Math.pow(d,1.4))*(+revAmtEl.value)*1.35;
  late.gain.value=(0.06+0.60*Math.pow(d,1.1))*(+revAmtEl.value)*1.85;
  comp.connect(earlyDelay).connect(early).connect(roomNode); comp.connect(late).connect(lateNode);
  const src=ctx.createBufferSource(), sources=[src];
  src.buffer=sample.buffer;
  const baseRate=Math.pow(2,(note-sample.note)/12), pitchLift=3+2*e;
  src.playbackRate.setValueAtTime(baseRate*Math.pow(2,pitchLift/1200),when);
  src.playbackRate.linearRampToValueAtTime(baseRate,when+0.020);     // attack 때 +3~5 cents, 20ms 뒤 복귀
  amp.gain.setValueAtTime(0,when);
  amp.gain.linearRampToValueAtTime(Math.max(0.001,loudnessGain),when+attack);
  amp.gain.setTargetAtTime(sustain,when+attack,decay);               // ADSR의 decay/sustain 구간
  src.connect(amp).connect(excitationLP); src.start(when);
  const maxDur=src.buffer.duration/baseRate;
  const voice={done:false};
  const dispose=()=>{ if(voice.done)return; voice.done=true; for(const source of sources)try{source.disconnect();}catch(e){}; for(const n of [amp,excitationLP,brightShelf,transientShelf,tiltShelf,hp,comp,spatialLP,panner,earlyDelay,early,late])try{n.disconnect();}catch(e){}; const i=harpFixedVoices.indexOf(voice); if(i>=0)harpFixedVoices.splice(i,1); };
  // 보이스 상한을 넘을 때 파형 한가운데서 disconnect하면 클릭 노이즈가 난다.
  // 약 220ms 동안 0으로 릴리스한 뒤에만 source/node를 정리한다.
  const release=()=>{
    if(voice.done || voice.releasing) return;
    voice.releasing=true;
    const releaseAt=ctx.currentTime;
    amp.gain.cancelScheduledValues(releaseAt);
    amp.gain.setTargetAtTime(0,releaseAt,0.032);
    try{ src.stop(releaseAt+0.22); }catch(e){}
    setTimeout(dispose,250);
  };
  voice.dispose=dispose; voice.release=release; harpFixedVoices.push(voice);
  // 이미 release 중인 첫 보이스를 다시 고르는 대신, 살아 있는 가장 오래된 보이스를
  // 하나씩 릴리스한다. 빠른 스윕에서도 보이스 수가 누적되어 오디오가 멈추지 않는다.
  let activeVoices=0;
  for(const v of harpFixedVoices) if(!v.releasing && !v.done) activeVoices++;
  while(activeVoices>HARP_MAX_ACTIVE_VOICES){
    let oldest=null;
    for(const v of harpFixedVoices){ if(!v.releasing && !v.done){ oldest=v; break; } }
    if(!oldest) break;
    oldest.release();
    activeVoices--;
  }
  src.onended=dispose;
  setTimeout(dispose,Math.ceil((delay+maxDur+0.15)*1000));
  return true;
}

// CIPIC subject 003에서 손 동선에 필요한 9방위×3고도만 추린 측정 HRIR.
// 원본 1.8MB SOFA를 런타임 파싱하지 않고 21KB int16 데이터만 AudioBuffer로 복원한다.
function buildMeasuredHrtfBuffers(){
  const data=window.CIPIC_HRIR_DATA;
  if(!ctx || !data?.base64) return [];
  const bytes=Uint8Array.from(atob(data.base64), c=>c.charCodeAt(0));
  const view=new DataView(bytes.buffer);
  const valuesPerFilter=2*data.taps;
  const filterCount=data.azimuths.length*data.elevations.length;
  const sampleScale=data.peak/32767*0.70;
  const outputTaps=Math.ceil(data.taps*ctx.sampleRate/data.sampleRate);
  const buffers=new Array(filterCount);
  for(let filterIndex=0; filterIndex<filterCount; filterIndex++){
    const buffer=ctx.createBuffer(2, outputTaps, ctx.sampleRate);
    const base=filterIndex*valuesPerFilter;
    for(let ear=0; ear<2; ear++){
      const channel=buffer.getChannelData(ear);
      const earBase=base+ear*data.taps;
      for(let tap=0; tap<outputTaps; tap++){
        const sourcePosition=tap*data.sampleRate/ctx.sampleRate;
        const index0=Math.min(data.taps-1, Math.floor(sourcePosition));
        const index1=Math.min(data.taps-1, index0+1);
        const mix=sourcePosition-index0;
        const sample0=view.getInt16((earBase+index0)*2, true);
        const sample1=view.getInt16((earBase+index1)*2, true);
        channel[tap]=(sample0+(sample1-sample0)*mix)*sampleScale;
      }
    }
    buffers[filterIndex]=buffer;
  }
  return buffers;
}

function nearestMeasuredHrtf(azimuth, elevation){
  const data=window.CIPIC_HRIR_DATA;
  if(!data) return 0;
  let best=0, bestDistance=Infinity;
  for(let elevationIndex=0; elevationIndex<data.elevations.length; elevationIndex++){
    for(let azimuthIndex=0; azimuthIndex<data.azimuths.length; azimuthIndex++){
      const da=(azimuth-data.azimuths[azimuthIndex])/20;
      const de=(elevation-data.elevations[elevationIndex])/28.125;
      const distance=da*da+de*de;
      if(distance<bestDistance){
        bestDistance=distance;
        best=elevationIndex*data.azimuths.length+azimuthIndex;
      }
    }
  }
  return best;
}

// 비활성 Convolver에 새 HRIR을 넣고 90ms 동안 등가전력으로 전환한다.
// 전환이 끝나면 이전 Convolver 입력을 끊어 안정 상태에서는 손마다 하나만 처리한다.
function updateMeasuredHrtf(voice, azimuth, elevation){
  if(!voice?.hrtfState || measuredHrtfBuffers.length===0) return;
  const state=voice.hrtfState;
  const nextIndex=nearestMeasuredHrtf(azimuth, elevation);
  if(nextIndex===state.index || state.pending>=0) return;
  const fromIndex=state.active;
  const toIndex=1-fromIndex;
  const from=fromIndex===0?voice.hrtfConvA:voice.hrtfConvB;
  const to=toIndex===0?voice.hrtfConvA:voice.hrtfConvB;
  const fromGain=fromIndex===0?voice.hrtfGainA:voice.hrtfGainB;
  const toGain=toIndex===0?voice.hrtfGainA:voice.hrtfGainB;
  const now=ctx.currentTime;
  state.pending=nextIndex;
  to.buffer=measuredHrtfBuffers[nextIndex];
  voice.palmShelf.connect(to);
  fromGain.gain.cancelScheduledValues(now);
  toGain.gain.cancelScheduledValues(now);
  fromGain.gain.setValueAtTime(1, now);
  toGain.gain.setValueAtTime(0, now);
  fromGain.gain.setValueCurveAtTime(HRTF_FADE_OUT, now, 0.09);
  toGain.gain.setValueCurveAtTime(HRTF_FADE_IN, now, 0.09);
  state.timer=setTimeout(()=>{
    try{ voice.palmShelf.disconnect(from); }catch(e){}
    state.active=toIndex;
    state.index=nextIndex;
    state.pending=-1;
    state.timer=null;
  }, 120);
}

// 음색 버튼: 세 음색을 독립 버튼으로 두고, 선택한 음색만 새 보이스로 교체한다.
function setTimbre(next){
  if(next===timbre){
    applySceneSpatialPreset(next);
    // 같은 연필 버튼을 다시 누르면 샘플 보이스까지 재구성해 무음 상태를 복구한다.
    if(next==='bark-friction'&&audioReady){
      rebuildTimbre();
      ensurePencilSceneAudio();
    }
    return;
  }
  timbre=next;
  applySceneSpatialPreset(next);
  syncParamGroups();
  // 먼저 새 음색 보이스를 만든 뒤 배경과 샘플을 활성화한다. 이전 보이스 정리와
  // 비동기 샘플 완료가 엇갈려 새 연필 노드가 샘플 없이 남는 경우를 막는다.
  rebuildTimbre();
  updateOceanForTimbre();
  updateWindForTimbre();
  updateForestForTimbre();
  if(next==='wind-flow') loadWindSample();
  if(next==='bark-friction') ensurePencilSceneAudio();
}

// 첫 장면(물)도 HTML 공통값이 아니라 수중 프리셋으로 시작한다.
// WALL_ABSORB 등 룸 상수 선언이 이 아래에 있으므로, 현재 스크립트 평가가 끝난 뒤 적용한다.
queueMicrotask(()=>applySceneSpatialPreset(timbre));

// 배경 바닷소리는 물 음색일 때만 재생 (나무껍질이면 무음).
function setSceneBedGain(param,target,active){
  if(!param||!ctx) return;
  const now=ctx.currentTime;
  // 전환 도중 다시 장면을 바꿔도 현재 음량에서 이어지게 유지한다.
  if(typeof param.cancelAndHoldAtTime==='function') param.cancelAndHoldAtTime(now);
  else {
    const current=param.value;
    param.cancelScheduledValues(now);
    param.setValueAtTime(current,now);
  }
  if(active) param.linearRampToValueAtTime(target,now+2.0);
  else param.setTargetAtTime(0,now,0.08);
}
function updateOceanForTimbre(){
  if(!oceanGain||!ctx) return;
  const active=timbre==='water-drops';
  setSceneBedGain(oceanGain.gain,active ? +bedVolEl.value : 0,active);
}
// 바람은 손이 없어도 하나의 전역 배경만 낮게 유지한다.
// 손별 보이스를 배경으로 재사용하면 같은 녹음이 세 번 겹쳐 위상과 볼륨이 불안정해진다.
function updateWindForTimbre(){
  if(!windBedGain||!ctx) return;
  const active=timbre==='wind-flow';
  setSceneBedGain(windBedGain.gain,active ? +windBedEl.value : 0,active);
}
// 숲 녹음은 연필 씬에서 선택적으로 유지되는 비공간화된 환경 바닥이다.
// 손에서 나는 종이 마찰음의 위치·거리·HRTF에는 섞지 않는다.
function updateForestForTimbre(){
  if(!forestGain||!ctx) return;
  const active=timbre==='bark-friction';
  setSceneBedGain(forestGain.gain,active ? +forestBedEl.value : 0,active);

function ensurePencilSceneAudio(){
  if(!ctx||timbre!=='bark-friction') return;
  // 이미 디코딩된 경우 즉시 재연결한다.
  if(forestBuf) startForestBed();
  if(pencilBuf){
    for(const side of ['Left','Right']) attachPencilSample(hand[side]);
    updatePencilRegion();
  }
  updateForestForTimbre();
  // 아직 로딩 중이거나 처음 로드하는 경우에도, 완료 시점의 현재 보이스에 다시 붙인다.
  loadForestSample().then(()=>{
    if(timbre!=='bark-friction') return;
    startForestBed();
    updateForestForTimbre();
  });
  loadPencilSample().then(()=>{
    if(timbre!=='bark-friction') return;
    for(const side of ['Left','Right']) attachPencilSample(hand[side]);
    updatePencilRegion();
  });
}
async function loadForestSample(){
  if(forestBuf) return forestBuf;
  if(forestLoadPromise) return forestLoadPromise;
  forestLoadPromise=fetch(FOREST_SAMPLE_URL)
    .then(res=>{ if(!res.ok) throw new Error(`forest sample: HTTP ${res.status}`); return res.arrayBuffer(); })
    .then(data=>ctx.decodeAudioData(data))
    .then(buffer=>{
      forestBuf=buffer;
      startForestBed();
      console.info(`[forest] ${buffer.duration.toFixed(1)}s loop ready`);
      return buffer;
    })
    .catch(err=>{ console.warn('[forest] sample load failed:',err); return null; })
    .finally(()=>{ forestLoadPromise=null; });
  return forestLoadPromise;
}
function startForestBed(){

function createDeskResonator(){
  if(!ctx||!master||deskInput) return;
  deskInput=ctx.createGain();
  deskHP=ctx.createBiquadFilter();
  deskHP.type='highpass'; deskHP.frequency.value=32; deskHP.Q.value=0.55;
  deskSum=ctx.createGain(); deskSum.gain.value=1.70;
  // 책상 상판의 비정수 모드. 저역 두 모드를 아래로 내리고 Q를 높여
  // 연필 마찰 뒤에 깊은 몸통이 조금 더 오래 남게 한다.
  const specs=[[54,34,1.08],[86,30,0.88],[139,22,0.62],[226,16,0.38],[370,10,0.20]];
  deskInput.connect(deskHP);
  deskModes=specs.map(([frequency,q,gain])=>{
    const filter=ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=frequency; filter.Q.value=q;
    const level=ctx.createGain(); level.gain.value=gain;
    deskHP.connect(filter).connect(level).connect(deskSum);
    return {filter,level};
  });
  deskComp=ctx.createDynamicsCompressor();
  deskComp.threshold.value=-18; deskComp.knee.value=12; deskComp.ratio.value=2.2;
  deskComp.attack.value=0.006; deskComp.release.value=0.20;
  // 책상은 손을 따라다니지 않고 사용자 정면 아래쪽의 고정된 물체로 들린다.
  deskPanner=new PannerNode(ctx,{
    panningModel:'HRTF',distanceModel:'inverse',
    refDistance:0.38,maxDistance:3,rolloffFactor:0.55,
    positionX:0,positionY:-0.32,positionZ:-0.62,
  });
  deskSum.connect(deskComp).connect(deskPanner).connect(master);
}
