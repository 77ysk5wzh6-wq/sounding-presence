      min-height: 100vh; margin: 0; display: grid; place-items: center;
      color: #20202b; background: #fafafa;

    nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    a {
      display: grid; place-items: center; min-height: 72px; padding: 18px;
      color: inherit; text-decoration: none; background: #fff;
      border: 1px solid #dedee3; border-radius: 14px;
      transition: transform .18s ease, background .18s ease;
    }
    a:hover { transform: translateY(-2px); background: #f4f4f6; }
