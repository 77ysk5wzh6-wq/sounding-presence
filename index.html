<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sounding Presence</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      color: #20202b; background: #fafafa;
    }
    main { width: min(640px, calc(100vw - 40px)); text-align: center; }
    p {
      margin: 0 0 34px; color: #18181b;
      font-size: clamp(18px, 2vw, 22px); font-weight: 500; line-height: 1.65;
    }
    .requirement {
      display: block; margin-top: 10px;
      font-size: 13px; font-weight: 400;
    }
    nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    a {
      display: grid; place-items: center; min-height: 72px; padding: 18px;
      color: inherit; text-decoration: none; background: #fff;
      border: 1px solid #dedee3; border-radius: 14px;
      transition: transform .18s ease, background .18s ease;
    }
    a:hover { transform: translateY(-2px); background: #f4f4f6; }
    @media (max-width: 480px) { nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p>한 작품의 청각적 매커니즘 구현과 시각요소 디자인을 따로 진행중입니다.<br>곧 합쳐 하나의 작품으로 만들 계획입니다.<span class="requirement">(이어폰과 카메라허용이 필수입니다)</span></p>
    <nav>
      <a href="./hand-sweep/">소리 프로토타입</a>
      <a href="./presence-glass/">시각 프로토타입</a>
    </nav>
  </main>
</body>
</html>
